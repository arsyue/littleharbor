name: Build and verify Little Harbor
on:
  push:
    branches: [main]
    paths: ['godot/**', 'web/**', 'cloud/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: little-harbor-web
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check reusable character recordings
        id: voice-check
        run: |
          node cloud/voice-plan.mjs
          python cloud/voices.py --check
      - name: Install cloud audio utilities
        if: steps.voice-check.outputs.needed == 'true' || steps.voice-check.outputs.audit_needed == 'true'
        timeout-minutes: 4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng ffmpeg
      - name: Install CPU speech runtime
        if: steps.voice-check.outputs.needed == 'true' || steps.voice-check.outputs.audit_needed == 'true'
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install Kokoro and speech verification
        if: steps.voice-check.outputs.needed == 'true' || steps.voice-check.outputs.audit_needed == 'true'
        timeout-minutes: 6
        run: python -m pip install --disable-pip-version-check kokoro==0.9.4 soundfile "faster-whisper>=1.1,<2"
      - name: Record all character dialogue with Kokoro
        if: steps.voice-check.outputs.needed == 'true'
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: python -u cloud/voices.py
      - name: Save generated recordings in the cloud
        if: steps.voice-check.outputs.needed == 'true'
        run: |
          git config user.name "Little Harbor Cloud"
          git config user.email "little-harbor@users.noreply.github.com"
          git add web/audio
          if ! git diff --cached --quiet; then
            git commit -m "Save Kokoro character recordings [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Decode and independently check spoken dialogue
        if: steps.voice-check.outputs.audit_needed == 'true'
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python -u cloud/voice-audit.py
      - name: Prepare lightweight aquarium in the cloud
        run: bash cloud/build.sh
      - name: Install cloud browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser verification
        run: node cloud/verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aquarium-review
          path: |
            qa-output/
            review/voice-audit.json
      - name: Save review results in the cloud
        if: always()
        run: |
          mkdir -p review
          if [ -f qa-output/results.json ]; then
            cp qa-output/*.jpg qa-output/*.json review/
          fi
          git config user.name "Little Harbor Cloud"
          git config user.email "little-harbor@users.noreply.github.com"
          git add review legacy/assets
          if ! git diff --cached --quiet; then
            git commit -m "Update cloud browser and voice review [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure public Pages hosting
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
