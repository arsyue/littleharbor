name: Build and verify Godot aquarium
on:
  push:
    branches: [main]
    paths: ['godot/**', 'web/**', 'cloud/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: godot-web
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Export Godot entirely in the cloud
        run: bash cloud/build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install cloud browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser verification
        run: node cloud/verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aquarium-review
          path: qa-output/
      - name: Save review images in the cloud
        if: always()
        run: |
          if [ ! -f qa-output/results.json ]; then exit 0; fi
          mkdir -p review
          cp qa-output/*.png qa-output/results.json review/
          git config user.name "Little Harbor Cloud"
          git config user.email "little-harbor@users.noreply.github.com"
          git add review legacy/assets
          if ! git diff --cached --quiet; then
            git commit -m "Update cloud browser review images [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure public Pages hosting
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
