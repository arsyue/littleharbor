name: Preserve existing game
on:
  push:
    paths: ['.github/workflows/preserve.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the public game entirely on the cloud runner
        shell: python
        run: |
          import pathlib, re, urllib.request, urllib.parse
          base = "https://little-harbor-english-aquarium.abloom-chub-6743.chatgpt.site/"
          root = pathlib.Path("legacy")
          queue = ["index.html", "style.css", "content.mjs", "state.mjs", "voice.mjs", "app.mjs"]
          seen = set()
          while queue:
              path = queue.pop(0)
              if path in seen:
                  continue
              if len(seen) > 150:
                  raise RuntimeError("Unexpected asset count")
              seen.add(path)
              if path.startswith("/") or ".." in pathlib.PurePosixPath(path).parts:
                  raise RuntimeError("Invalid asset path")
              req = urllib.request.Request(base + path, headers={"User-Agent": "LittleHarbor-Cloud-Migration/1.0"})
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = response.read(25_000_000)
                  kind = response.headers.get("Content-Type", "")
              if path.endswith((".mjs", ".css", ".webp")) and "text/html" in kind:
                  raise RuntimeError("Unexpected HTML response for " + path)
              out = root / path
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(data)
              print(path, len(data))
              if path.endswith((".html", ".css", ".mjs")):
                  text = data.decode("utf-8")
                  for asset in re.findall(r"""assets/[a-zA-Z0-9_./-]+\.(?:webp|png|jpg|jpeg|svg|woff2)""", text):
                      if asset not in seen:
                          queue.append(asset)
          print("Preserved", len(seen), "files")
      - name: Save the preserved source in GitHub
        run: |
          git config user.name "Little Harbor Cloud"
          git config user.email "little-harbor@users.noreply.github.com"
          git add legacy
          if ! git diff --cached --quiet; then
            git commit -m "Preserve the published game and artwork in the cloud"
            git push origin HEAD:main
          fi
