<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore Little Harbor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#afcda7;font:14px system-ui;color:#213f3d}canvas{display:block;width:100%;height:100%;touch-action:none;outline-offset:-4px}
button,select{font:inherit;color:inherit;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #d4a653;outline-offset:3px}
.badge{position:absolute;top:18px;left:18px;padding:12px 16px;border-radius:16px;background:#fffcf1ed;box-shadow:0 4px 18px #27473d18}.badge b{display:block;font:600 18px Georgia}.badge small{display:block;margin-top:4px;font-size:11px;color:#60776d}
.routes{position:absolute;top:18px;right:18px;display:flex;gap:7px;align-items:center}.routes select,.routes button{border:0;background:#fffdf4eb;padding:10px 12px;border-radius:12px;max-width:180px}
.minimap{position:absolute;right:18px;top:73px;width:144px;height:100px;background:#f8fae9ed;border:5px solid #fffdf0;border-radius:15px;box-shadow:0 5px 20px #24443720}.minimap canvas{border-radius:10px}
.help{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);padding:10px 16px;border-radius:20px;background:#fffdf1ed;color:#567369;font-size:12px;white-space:nowrap;pointer-events:none}
#interact{position:absolute;right:20px;bottom:72px;max-width:240px;border:2px solid #fff7db;background:#2f6a5b;color:white;box-shadow:0 5px 18px #25443738;border-radius:17px;padding:13px 19px;font-weight:600}
#interact:disabled{opacity:.65;background:#688a75}.pad{position:absolute;left:18px;bottom:18px;width:132px;height:132px;display:grid;grid-template:repeat(3,44px)/repeat(3,44px);gap:0}
.pad button{border:1px solid #fdfbeaa8;background:#fffdefd4;border-radius:13px;font-size:20px;touch-action:none;user-select:none;box-shadow:0 2px 5px #304f4014}.pad button:active{background:#d5e6b9}
.pad [data-key="ArrowUp"]{grid-area:1/2}.pad [data-key="ArrowLeft"]{grid-area:2/1}.pad [data-key="ArrowRight"]{grid-area:2/3}.pad [data-key="ArrowDown"]{grid-area:3/2}
#status{position:absolute;left:18px;top:91px;background:#fffdf0cf;border-radius:12px;padding:7px 11px;font-size:11px;max-width:250px}
@media(min-width:800px){.pad{opacity:.7;transform:scale(.8);transform-origin:bottom left}}
@media(max-width:700px){.badge{top:12px;left:12px;padding:10px 12px}.badge b{font-size:15px}.badge small{font-size:9px}.routes{top:12px;right:12px}.routes select{width:122px;font-size:11px;padding:10px 6px}.routes button{display:none}.minimap{width:112px;height:78px;right:12px;top:57px}#status{top:81px;left:12px;max-width:190px;font-size:10px}.help{font-size:10px;bottom:8px;padding:5px 10px}.pad{left:10px;bottom:27px;width:114px;height:114px;grid-template:repeat(3,38px)/repeat(3,38px)}#interact{right:12px;bottom:45px;max-width:200px;font-size:12px;padding:11px 13px}}

body{background:#96b983;color:#284e47}
.badge{border:1px solid #fff8e3;border-radius:18px;padding:14px 20px 13px 47px;background:linear-gradient(135deg,#fffdf4f5,#f8eacff2);box-shadow:0 6px 24px #25473720,inset 0 1px #fff}
.badge:before{content:'✦';position:absolute;left:17px;top:17px;color:#be9250;font-size:24px}.badge b{font:600 21px Georgia;letter-spacing:-.4px}.badge small{font-size:11px;letter-spacing:.25px}
.routes select,.routes button{border:1px solid #fffcdf;border-radius:12px;background:linear-gradient(#fffdf5f5,#f6ecd8ed);box-shadow:0 4px 12px #2443341a}
.minimap{border:5px solid #fff6e3;outline:1px solid #b7a67988;box-shadow:0 6px 22px #24443738}
.help{background:#fff7e4df;border:1px solid #fff9e9;color:#517266;font-size:11px}
#status{background:#fbf4dfde;border:1px solid #fffae7;color:#4f6c5d;box-shadow:0 3px 12px #304c3110}
#interact{border:1px solid #f8e4ad;background:linear-gradient(#407c6c,#245c52);box-shadow:0 5px 15px #153f3b38,inset 0 1px #ffffff30}
#interact:disabled{background:#507e69;opacity:.8}
.pad button{background:linear-gradient(#fff9e9ee,#eddfbde5);border-color:#fff6df;box-shadow:0 3px 8px #34523420;color:#547160}
#loading{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 35%,#fff7df,#c4d8aa);text-align:center;gap:12px}
#loading b{font:600 34px Georgia;color:#326959}#loading .shell{font-size:48px;color:#b98a4e}#loading p{margin:0;color:#5a7966}#retry{padding:11px 25px;background:#326959;color:#fff7e3;border:0;border-radius:12px}
@media(max-width:700px){.badge{padding:10px 12px 10px 30px}.badge:before{left:9px;top:10px;font-size:18px}.badge b{font-size:15px}.badge small{font-size:9px}.help{font-size:9px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body>
<div id="loading" role="status"><span class="shell">✦</span><b>Little Harbor</b><p>A little adventure by the sea</p><p id="loading-progress">Opening the harbor…</p><button id="retry" hidden>Try again</button></div>
<canvas id="world" tabindex="0" aria-label="Walk around Little Harbor. Use arrow keys or W A S D, tap the ground, or choose a destination. Press E near a person or sign."></canvas>
<div class="badge"><b>Little Harbor</b><small id="district">Town Square</small></div>
<div class="routes"><select id="destination" aria-label="Choose a place to walk to"><option value="">Where shall we go?</option></select><button id="center" aria-label="Center map on your explorer">Find me</button></div>
<div class="minimap"><canvas id="map" aria-label="Town minimap"></canvas></div><div id="status" role="status">Welcome, explorer. Choose a path.</div>
<button id="interact" disabled>Walk closer to a friend</button>
<div class="pad" aria-label="Walking controls"><button data-key="ArrowUp" aria-label="Walk north">↑</button><button data-key="ArrowLeft" aria-label="Walk west">←</button><button data-key="ArrowRight" aria-label="Walk east">→</button><button data-key="ArrowDown" aria-label="Walk south">↓</button></div>
<div class="help">WASD / arrow keys · Tap to walk · E to interact</div>
<script type="module" src="town.mjs"></script></body></html>
