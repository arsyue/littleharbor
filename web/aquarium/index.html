<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Harbor — Living Aquarium</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#123b3f;color:#e5f2dd;font:12px system-ui}
canvas{display:block;width:100%;height:100%;touch-action:none;outline-offset:-4px}
.controls{position:absolute;left:22px;bottom:155px;display:flex;gap:5px}
button{border:1px solid #cde7d22e;border-radius:18px;background:#09252bbd;color:#e6eee2;font:inherit;padding:8px 11px;cursor:pointer;backdrop-filter:blur(8px)}
button:hover,button:focus-visible{background:#305a58;outline:2px solid #dfe9b4;outline-offset:2px}
.note{position:absolute;right:24px;bottom:158px;opacity:.68;font-size:11px;pointer-events:none}
@media(max-width:700px){.controls{left:14px;top:57px;bottom:auto}button{font-size:10px;padding:7px 8px}.note{display:none}}
html,body{font-size:16px}button{min-height:44px}.controls{bottom:70px}.note{bottom:80px;font-size:15px}@media(max-width:700px){.controls{top:108px;left:10px;right:10px;gap:4px;bottom:auto}button{font-size:15px;padding:8px}.note{display:none}}
</style></head><body>
<canvas tabindex="0" aria-label="Your living aquarium. Click empty water or press Space to feed. Click a fish to meet it."></canvas>
<div class="controls" aria-label="Aquarium controls"><button id="light" aria-pressed="false">☀ Daylight</button><button id="pause" aria-pressed="false">Ⅱ Pause</button><button id="immerse" aria-pressed="false">⛶ Full Screen</button></div>
<div class="note">Tap the water to feed · Tap a fish to say hello</div>
<script type="module" src="aquarium.mjs"></script></body></html>
