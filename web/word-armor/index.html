<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171b19"><title>词甲战线 · Word Armor</title><meta name="description" content="1v1、2v2、3v3 实时单词坦克对战，选择你的词表，用拼写击破敌方阵营。"><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./style.css"></head>
<body><header class="mast"><div class="mastin"><div class="brand"><canvas id="brandTank" width="42" height="30" aria-hidden="true"></canvas><div><b>词甲战线</b><small>WORD ARMOR</small></div></div><div class="tools"><button id="manual" class="quiet"><i data-i="book"></i><span>作战手册</span></button><button id="sound" class="quiet icon" aria-label="开启音效" title="开启音效"></button><span class="divider"></span><button id="rooms" class="roomBtn"><i data-i="people"></i>联机房间</button></div></div></header>
<main><div class="heading"><div class="titleGroup"><div class="eyebrow"><span class="twoBars"></span><span id="kind">自由练习</span></div><h1>河谷前线</h1></div><div class="config"><div id="modes" class="segments" aria-label="对战人数"><button data-n="1">1<span>V</span>1</button><button data-n="2">2<span>V</span>2</button><button data-n="3" class="on">3<span>V</span>3</button></div><button id="rules" class="secondary ruleBtn" title="血量与训练设置" aria-label="调整血量与训练设置"><span id="ruleHP">10 HP</span></button><button id="decks" class="secondary"><i data-i="layers"></i>阵营词表</button></div></div>
<div class="arenaFrame"><div class="teambar"><div class="side blue"><span class="shield"><i data-i="crest"></i></span><div><strong>苍蓝营</strong><small id="leftDeck">自然探索</small></div><b class="survivors" id="leftAlive">3 / 3</b></div><b class="versus">VS</b><div class="side orange"><span class="shield"><i data-i="crest"></i></span><div><strong>赤焰营</strong><small id="rightDeck">自然探索</small></div><b class="survivors" id="rightAlive">3 / 3</b></div></div>
<div id="stage"><canvas id="terrain" aria-label="河谷坦克战场"></canvas><div class="mapCorners"></div><div id="units"></div><div class="compass" aria-hidden="true"><b>N</b><em></em></div></div>
<div class="arenaFoot"><span class="liveState"><i class="lamp"></i><b id="status">待命</b><span class="slash">/</span><span id="fieldMsg" aria-live="polite">输入敌方单词即可开战</span></span><div class="timeSide"><i data-i="clock"></i><b id="clock">00:00</b><button id="pause" aria-label="开始训练" title="开始训练"><i data-i="play"></i></button></div></div></div>
<section class="console" aria-label="拼写控制台"><div class="targetPanel"><div class="tiny"><i data-i="aim"></i>锁定目标 <b id="targetID">B1</b></div><div class="targetWord"><strong id="targetZh">森林</strong><span id="targetLetter">F</span></div></div><form id="fireForm"><label for="answer" class="tiny">拼写指令</label><div class="inputrow"><div class="inputWrap"><i data-i="keyboard"></i><input id="answer" type="text" inputmode="latin" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="45" placeholder="输入目标的英文单词…"></div><button class="fire" id="fire" type="submit"><i data-i="aim"></i>开火 <kbd>↵</kbd></button></div></form></section>
<div class="under"><div class="shortcuts"><span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 切换目标</span><span><kbd>Enter</kbd> 开火</span></div><div class="bottomStats"><span>命中 <b id="hits">0</b></span><span>准确率 <b id="accuracy">—</b></span><button id="history" title="战斗记录"><i data-i="list"></i> 战斗记录</button></div></div></main>
<dialog id="dialog"><div class="dlgHead"><h2 id="dlgTitle"></h2><button id="closeDlg" aria-label="关闭" class="quiet icon">✕</button></div><div id="dlgBody"></div></dialog><div id="toast" role="status"></div>
<script src="./engine.js" defer></script><script src="./art.js" defer></script><script src="./room-core.js" defer></script><script src="./peer.min.js" defer></script><script src="./network.js" defer></script><script src="./app.js" defer></script></body></html>
